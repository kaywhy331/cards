name: Diagnose production bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query production bootstrap endpoints without mutating production
        shell: bash
        run: |
          set -euo pipefail
          base="https://ezcards.netlify.app/api"

          echo "=== GET /health ==="
          curl -sS -i "$base/health"
          echo

          echo "=== GET /bootstrap ==="
          curl -sS -i "$base/bootstrap"
          echo

          echo "=== POST /bootstrap with deliberately invalid token ==="
          curl -sS -i -X POST "$base/bootstrap" \
            -H 'content-type: application/json' \
            --data '{"token":"diagnostic-invalid-token","name":"Diagnostic","email":"diagnostic-invalid@example.invalid","password":"diagnostic-password-123"}'
          echo

      - name: Wait for deploy-preview diagnostic endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://deploy-preview-6--ezcards.netlify.app/diagnostic/bootstrap-primitives"
          for attempt in $(seq 1 30); do
            status="$(curl -sS -o /tmp/diagnostic.json -w '%{http_code}' \
              -H 'x-diagnostic-key: ezcards-bootstrap-primitives-v1' \
              --max-time 20 "$url" || true)"
            if [[ "$status" == "200" ]]; then
              cat /tmp/diagnostic.json
              grep -Fq '"ok":true' /tmp/diagnostic.json
              exit 0
            fi
            echo "Attempt $attempt/30: status=$status"
            cat /tmp/diagnostic.json 2>/dev/null || true
            sleep 5
          done
          echo "Diagnostic endpoint failed"
          cat /tmp/diagnostic.json 2>/dev/null || true
          exit 1
