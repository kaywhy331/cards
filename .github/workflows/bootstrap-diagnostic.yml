name: Diagnose production bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production bootstrap route preconditions
        shell: bash
        run: |
          set -euo pipefail
          base="https://ezcards.netlify.app/api"
          echo "Health:"
          curl -sS "$base/health"
          echo
          echo "Bootstrap status:"
          curl -sS "$base/bootstrap"
          echo
          echo "Expected invalid-token response:"
          curl -sS -X POST "$base/bootstrap" \
            -H 'content-type: application/json' \
            --data '{"token":"diagnostic-invalid-token","name":"Diagnostic","email":"diagnostic-invalid@example.invalid","password":"diagnostic-password-123"}'
          echo

      - name: Capture deploy-preview bootstrap primitive diagnostic
        shell: bash
        run: |
          set -u
          url="https://deploy-preview-6--ezcards.netlify.app/.netlify/functions/bootstrap-primitives-diagnostic"
          status="$(curl -sS -o /tmp/diagnostic.json -w '%{http_code}' \
            -H 'x-diagnostic-key: ezcards-bootstrap-primitives-v1' \
            --max-time 30 "$url" || true)"
          echo "HTTP $status"
          cat /tmp/diagnostic.json 2>/dev/null || true
          echo
          test "$status" = "200"
          grep -Fq '"ok":true' /tmp/diagnostic.json
