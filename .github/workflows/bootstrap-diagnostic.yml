name: Diagnose production bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production bootstrap route preconditions
        shell: bash
        run: |
          set -euo pipefail
          base="https://ezcards.netlify.app/api"
          echo "Health:"; curl -sS "$base/health"; echo
          echo "Bootstrap:"; curl -sS "$base/bootstrap"; echo
          echo "Invalid token:"; curl -sS -X POST "$base/bootstrap" \
            -H 'content-type: application/json' \
            --data '{"token":"diagnostic-invalid-token","name":"Diagnostic","email":"diagnostic-invalid@example.invalid","password":"diagnostic-password-123"}'; echo

      - name: Verify deploy-preview function discovery
        shell: bash
        run: |
          set -u
          base="https://deploy-preview-6--ezcards.netlify.app"
          for path in "/api/diag" "/diagnostic/bootstrap-primitives" "/.netlify/functions/diag" "/.netlify/functions/bootstrap-primitives-diagnostic"; do
            status="$(curl -sS -o /tmp/out -w '%{http_code}' \
              -H 'x-diagnostic-key: ezcards-bootstrap-primitives-v1' \
              --max-time 30 "$base$path" || true)"
            echo "$path => HTTP $status"
            head -c 1200 /tmp/out 2>/dev/null || true
            echo
          done
