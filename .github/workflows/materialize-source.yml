name: Materialize staged AIO lab source

on:
  push:
    branches:
      - agent/aio-simulation-lab
    paths:
      - .source-upload/READY
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-aio-lab-source
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/aio-simulation-lab
          fetch-depth: 0

      - name: Exit when source was already materialized
        id: guard
        shell: bash
        run: |
          if [[ ! -f .source-upload/READY ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Reassemble and verify source archive
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .source-upload/part-* > /tmp/cards-source.b64
          base64 --decode /tmp/cards-source.b64 > /tmp/cards-source.tar.gz
          echo "33eda3865adb83eb1b0a77220588db96c0ce2f77004dfae9fd6b60c84fd6a6fc  /tmp/cards-source.tar.gz" | sha256sum --check --strict

      - name: Extract complete source tree
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar --extract --gzip --file /tmp/cards-source.tar.gz --directory .
          rm -rf .source-upload
          rm -f .github/workflows/materialize-source.yml

      - name: Commit materialized implementation
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add isolated AIO simulation lab"
          git push origin HEAD:agent/aio-simulation-lab
