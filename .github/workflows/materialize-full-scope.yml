name: Materialize full EZ Cards source

on:
  push:
    branches:
      - agent/full-scope-mvp
    paths:
      - .source-full/READY
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-full-ezcards-source
  cancel-in-progress: false

jobs:
  materialize:
    if: github.ref_name == 'agent/full-scope-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-scope-mvp
          fetch-depth: 0

      - name: Verify staging marker
        shell: bash
        run: |
          set -euo pipefail
          test -f .source-full/READY
          test -f .source-full/MANIFEST

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .source-full/part-* | tr -d '\r\n' > /tmp/ezcards-source.b64
          base64 --decode /tmp/ezcards-source.b64 > /tmp/ezcards-source.tar.gz
          echo "4dc9739936df10a2a70798a28733e16d796822f5a892414dbf2f9e2f736e86bd  /tmp/ezcards-source.tar.gz" | sha256sum --check --strict
          tar --list --gzip --file /tmp/ezcards-source.tar.gz >/dev/null

      - name: Extract complete source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --extract --gzip --file /tmp/ezcards-source.tar.gz --directory .
          rm -rf .source-full
          rm -f .github/workflows/materialize-full-scope.yml

      - name: Validate staged source structure
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f netlify/functions/api.mjs
          test -f netlify/functions/signal-worker.mjs
          test -f extension/manifest.json
          test -f retailer-lab.html
          test -f docs/COMPLETION_CRITERIA.md

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: implement full EZ Cards platform and localized education lab"
          git push origin HEAD:agent/full-scope-mvp
