name: Materialize complete EZ Cards platform

on:
  push:
    branches:
      - agent/full-scope-complete
    paths:
      - .source-full/READY
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-complete-ezcards-platform
  cancel-in-progress: false

jobs:
  materialize:
    if: github.ref_name == 'agent/full-scope-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-scope-complete
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .source-full/READY
          test -f .source-full/MANIFEST
          cat .source-full/part-* | tr -d '\r\n' > /tmp/ezcards-source.b64
          base64 --decode /tmp/ezcards-source.b64 > /tmp/ezcards-source.tar.xz
          echo "e99256bcfd279672e7a496a068cff5b8345c1ce390aced538bfd0266fca8eb05  /tmp/ezcards-source.tar.xz" | sha256sum --check --strict
          tar --list --xz --file /tmp/ezcards-source.tar.xz >/dev/null

      - name: Extract and validate complete platform
        shell: bash
        run: |
          set -euo pipefail
          tar --extract --xz --file /tmp/ezcards-source.tar.xz --directory .
          rm -rf .source-full
          rm -f .github/workflows/materialize-full-scope.yml
          test -f package.json
          test -f netlify/functions/api.mjs
          test -f netlify/functions/signal-worker.mjs
          test -f extension/manifest.json
          test -f retailer-lab.html
          test -f docs/COMPLETION_CRITERIA.md

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: implement complete EZ Cards platform and localized education lab"
          git push origin HEAD:agent/full-scope-complete
